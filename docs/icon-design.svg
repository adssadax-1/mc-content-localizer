<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22384F"/>
      <stop offset="1" stop-color="#0F1B2D"/>
    </linearGradient>
    <linearGradient id="grassTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CC152"/>
      <stop offset="1" stop-color="#6FA83C"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 深色圆形底（呼应原图标的深底圆形构图） -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- 轨道环：青色，缺口在右上（被气泡填充，形成层次） -->
  <path d="M 307.8 62.8 A 200 200 0 1 0 449.2 204.2"
        fill="none" stroke="#24C8D8" stroke-width="11" stroke-linecap="round" opacity="0.85"/>

  <!-- MC 像素星星 -->
  <g stroke="#ffffff" stroke-linecap="round">
    <path d="M 139 110 H 161 M 150 99 V 121" stroke-width="7" opacity="0.9"/>
    <path d="M 387 300 H 403 M 395 292 V 308" stroke-width="5" opacity="0.7"/>
    <path d="M 98 230 H 112 M 105 223 V 237" stroke-width="5" opacity="0.6"/>
  </g>

  <!-- 轨道上的卫星像素方块（黄 / 草绿点缀色） -->
  <rect x="105.6" y="105.6" width="18" height="18" fill="#FFC131" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="102.6" y="385.4" width="24" height="24" fill="#7ED957" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>

  <!-- 方块投影 -->
  <ellipse cx="256" cy="402" rx="118" ry="17" fill="#000000" opacity="0.28"/>

  <!-- MC 草方块（等距立体：顶面草绿 / 左右侧面泥土棕） -->
  <polygon points="256,148 376,208 256,268 136,208" fill="url(#grassTop)"/>
  <polygon points="136,208 256,268 256,388 136,328" fill="#6B4A2F"/>
  <polygon points="376,208 256,268 256,388 376,328" fill="#8A6238"/>

  <!-- 顶面草色像素纹理 -->
  <g fill="#5F9E35" opacity="0.85">
    <polygon points="256,164.5 267,170 256,175.5 245,170"/>
    <polygon points="216,190.5 227,196 216,201.5 205,196"/>
    <polygon points="296,220.5 307,226 296,231.5 285,226"/>
    <polygon points="330,198.5 341,204 330,209.5 319,204"/>
  </g>

  <!-- 侧面泥土像素纹理 -->
  <polygon points="168,262 190,273 190,297 168,286" fill="#5A3D26"/>
  <polygon points="322,262 344,251 344,275 322,286" fill="#74502C"/>
  <polygon points="206,318 224,327 224,347 206,338" fill="#5A3D26" opacity="0.8"/>

  <!-- 顶面高光 -->
  <polygon points="256,148 376,208 256,268 136,208" fill="url(#gloss)"/>

  <!-- 翻译气泡：白色圆角矩形 + 尾巴指向方块 -->
  <g filter="url(#shadow)">
    <path d="M 332 184 L 314 220 L 362 186 Z" fill="#ffffff"/>
    <rect x="296" y="84" width="148" height="104" rx="26" fill="#ffffff"/>
  </g>

  <!-- 气泡文字：「译」深蓝 + 「A」橙 -->
  <text x="350" y="157" text-anchor="middle"
        font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
        font-size="52" font-weight="bold" fill="#243B55">译</text>
  <text x="402" y="158" text-anchor="middle"
        font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
        font-size="56" font-weight="bold" fill="#D97706">A</text>
</svg>
