[package]
name = "mc-content-localizer"
version = "2.0.1"
description = "MC 汉化工坊：Minecraft 模组/光影包/资源包 AI 汉化工具"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mc_content_localizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产构建必须启用（tauri build / cargo build --release --features custom-protocol）：
# 启用后前端 dist/ 资源内嵌进 exe；不启用则应用会尝试加载 devUrl（localhost:1420）
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zip = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
regex = "1"
tokio = { version = "1", features = ["time"] }
zhconv = "0.3"
